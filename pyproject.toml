[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clockcheck"
version = "0.1.0"
description = "An honest audit harness for epigenetic aging clocks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Masha" }]
keywords = ["epigenetic clock", "aging", "DNA methylation", "benchmark", "reproducibility"]
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
# Recommended: real published clock coefficients + real GEO data loaders.
real = ["biolearn>=0.9"]
dev = ["pytest>=7"]

[project.scripts]
clockcheck = "clockcheck.cli:main"

[project.urls]
Homepage = "https://github.com/mimepsilon/clockcheck"

[tool.setuptools.packages.find]
where = ["src"]
